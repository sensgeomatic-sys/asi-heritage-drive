<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENS Geomatic · ASI Heritage Drive</title>
<meta name="description" content="Secure drive for ASI heritage records (PDF & AutoCAD) under the AMASR Act, 1958 — SENS GEOMATIC PVT. LTD">
<meta name="theme-color" content="#0B1F33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="https://static.wixstatic.com/media/51d4bf_9c5363dbabfa471f93f803f757b755e5~mv2.png/v1/fill/w_192,h_192,al_c,q_90/icon.png">
<link rel="apple-touch-icon" href="https://static.wixstatic.com/media/51d4bf_9c5363dbabfa471f93f803f757b755e5~mv2.png/v1/fill/w_180,h_180,al_c,q_90/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SENS Geomatic">
<style>
  html,body{margin:0;height:100%;background:#0B1F33;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#EAF1F7}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .3s}
  #app.ready{opacity:1}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  #splash img{width:96px;height:96px;border-radius:20px;background:#fff;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #splash h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
  #splash p{margin:0;color:#9FB6CA;font-size:14px}
  .bar{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#F0A24E;animation:s 1.1s ease-in-out infinite}
  @keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  #offline{display:none}
  body.off #offline{display:block;color:#F0A24E}
  body.off .bar{display:none}
  button{margin-top:6px;background:#D9822B;color:#1f1205;border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div id="splash">
  <img src="https://static.wixstatic.com/media/51d4bf_9c5363dbabfa471f93f803f757b755e5~mv2.png/v1/fill/w_192,h_192,al_c,q_90/icon.png" alt="SENS Geomatic">
  <h1>ASI Heritage Drive</h1>
  <p>SENS GEOMATIC PVT. LTD</p>
  <div class="bar"><i></i></div>
  <p id="offline">You're offline. Connect to the internet to open the secure drive.<br><button onclick="location.reload()">Try again</button></p>
</div>
<iframe id="app" credentialless title="SENS Geomatic · ASI Heritage Drive" allow="geolocation; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  // The secure drive itself runs on Google Apps Script (sensgeomatic@gmail.com).
  var APP_URL = 'https://script.google.com/macros/s/AKfycbz3aNE8pKUb96GRduUL6GKqRnwOJT8ptI0IIyMu8p0JvFWtF9D0pCZ59b_aSB20aIgMMw/exec';
  var frame = document.getElementById('app');
  function load() {
    if (!navigator.onLine) { document.body.classList.add('off'); return; }
    document.body.classList.remove('off');
    frame.src = APP_URL;
  }
  frame.addEventListener('load', function () { if (frame.src) { frame.classList.add('ready'); } });
  window.addEventListener('online', function () { if (!frame.src) load(); });
  window.addEventListener('offline', function () { if (!frame.classList.contains('ready')) document.body.classList.add('off'); });
  load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
